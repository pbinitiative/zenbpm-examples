spring.application.name=bank-loan-worker

# Suppress the BeanPostProcessorChecker warning triggered by ZenBPM's auto-configuration
# declaring zenbpmJobWorkerManager as a non-static @Bean factory method. This is a known
# library issue and has no functional impact; the warning is noise in the logs.
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate=ERROR
spring.main.keep-alive=true

zenbpm.rest-url=http://localhost:8080/v1
zenbpm.rest-logging-enabled=true

zenbpm.grpc-host=localhost
zenbpm.grpc-port=9090
zenbpm.grpc-plaintext=true
zenbpm.grpc-logging-enabled=true

zenbpm.job-worker-enabled=true
zenbpm.otel-enabled=false

otel.sdk.disabled=true
