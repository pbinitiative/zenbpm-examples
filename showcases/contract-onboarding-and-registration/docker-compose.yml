include:
  - ../../docker-compose.yml

# NOTE: the ZenBPM service name is 'zenbpm' (defined in ../../docker-compose.yml).
# Verify this matches if the root docker-compose.yml is ever renamed.

services:
  deploy-contract-onboarding:
    image: curlimages/curl:latest
    depends_on:
      zenbpm:
        condition: service_healthy
    volumes:
      - ./process:/process:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Deploying contract onboarding process..."
        for f in /process/*.bpmn /process/*.dmn; do
          [ -f "$$f" ] || continue
          echo "  -> $$f"
          curl -sfS -X POST http://zenbpm:8080/v1/process-definitions -F "resource=@$$f"
          echo ""
        done
        echo "Done."

  contract-onboarding-worker:
    build:
      context: ./workers/contract-onboarding-worker
    restart: unless-stopped
    environment:
      ZENBPM_GRPC_HOST: zenbpm
      ZENBPM_GRPC_PORT: 9090
    depends_on:
      zenbpm:
        condition: service_healthy

  contract-onboarding-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      ZENBPM_BASE_URL: http://zenbpm:8080/v1
      PORTAL_CORS_ALLOWED_ORIGINS: http://localhost:5173
      PORTAL_PROCESS_DEFAULT_KEY: contract_onboarding_and_registration
    depends_on:
      zenbpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  contract-onboarding-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      contract-onboarding-backend:
        condition: service_healthy
