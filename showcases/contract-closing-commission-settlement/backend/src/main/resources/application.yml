server:
  port: 8081

zenbpm:
  base-url: ${ZENBPM_URL:http://zenbpm:8080/v1}

portal:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  process:
    default-key: ${PORTAL_PROCESS_DEFAULT_KEY:Process_Contract_Closing}

management:
  endpoints:
    web:
      exposure:
        include: health
