# ZenBPM engine for the Getting Started track.
#
# Start:   docker compose up -d
# Verify:  curl http://localhost:8080/v1/process-definitions   (empty list = healthy)
# Stop:    docker compose down
#
# This runs ONLY the engine. Workers are something you write and run yourself
# (see 02-hello-world) — that is the whole point of the tutorial. The optional
# UI is off by default; enable it with:  docker compose --profile ui up -d
services:
  zenbpm:
    image: ghcr.io/pbinitiative/zenbpm:latest
    ports:
      - "8080:8080"   # REST API
      - "9090:9090"   # gRPC (workers)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  zenbpm-ui:
    image: ghcr.io/pbinitiative/zenbpm-ui:latest
    profiles: ["ui"]          # optional: docker compose --profile ui up -d
    ports:
      - "9000:80"             # http://localhost:9000
    depends_on:
      zenbpm:
        condition: service_healthy
